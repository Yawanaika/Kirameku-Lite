# Docker Compose deployment for the single-process Kirameku app.
#
# The image is built by GitHub Actions and published to GHCR; the server only
# pulls it. Nothing here compiles code.
#
#   cp compose.env.example .env      # fill in AUTH_SECRET + SITE_DOMAIN
#   docker compose pull
#   docker compose up -d
#
# Caddy terminates TLS (automatic Let's Encrypt) and proxies to the app over the
# internal network. The app itself is not published on the host at all.
#
# SQLite, uploads and backups live in the `kirameku-data` volume and survive
# image upgrades.
#
# Building locally instead of pulling:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Keeping an existing host-level Caddy/Nginx instead of the bundled one:
#   docker compose -f docker-compose.yml -f docker-compose.host-proxy.yml up -d app
name: kirameku

services:
  app:
    image: ${KIRAMEKU_IMAGE:-ghcr.io/yawanaika/kirameku:latest}
    # `docker compose up -d` should always pick up a freshly pushed :latest.
    pull_policy: always
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_PATH: /data/db/kirameku.db
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
      # Required: generate with `openssl rand -base64 48` (>= 32 chars).
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required; copy compose.env.example to .env and fill it in}
      CRON_SECRET: ${CRON_SECRET:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      SITE_READ_ONLY: ${SITE_READ_ONLY:-0}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_CUSTOM_DOMAIN: ${OSS_CUSTOM_DOMAIN:-}
      OSS_PREFIX: ${OSS_PREFIX:-}
      VISITOR_RETENTION_DAYS: ${VISITOR_RETENTION_DAYS:-90}
    volumes:
      - kirameku-data:/data
    networks:
      - edge

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Required: the public hostname Caddy should obtain a certificate for.
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN is required; set it to your public hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge

volumes:
  kirameku-data:
  caddy-data:
  caddy-config:

networks:
  edge:
