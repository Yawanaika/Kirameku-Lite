# Docker Compose deployment for the single-process Kirameku app.
#
# The image is built by GitHub Actions and published to GHCR; the server only
# pulls it. Nothing here compiles code.
#
#   cp compose.env.example .env      # fill in AUTH_SECRET (+ SHARED_NETWORK)
#   docker network create kirameku-edge      # one time, see below
#   docker compose pull
#   docker compose up -d
#
# REVERSE PROXY
# -------------
# This file runs the app only. It publishes no host port; the container is
# reachable on the external `kirameku-edge` network as `kirameku-app:3000`, and
# your own proxy attaches to that network. That is the default because the
# server already runs a Caddy container in another compose project — a
# container-based proxy cannot reach the host's 127.0.0.1.
#
#   # in the Caddy project's docker-compose.yml
#   networks:
#     kirameku:
#       external: true
#       name: kirameku-edge
#   services:
#     caddy:
#       networks: [kirameku, ...]
#
#   # in that project's Caddyfile
#   boke.example.com {
#       encode zstd gzip
#       request_body { max_size 12MB }
#       reverse_proxy kirameku-app:3000
#   }
#
# Two alternatives, both opt-in:
#   * No proxy of your own — let this stack run Caddy:
#       docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
#   * Host-level proxy (systemd Caddy/Nginx on the host itself):
#       docker compose -f docker-compose.yml -f docker-compose.host-proxy.yml up -d app
#
# SQLite, uploads and backups live in the `kirameku-data` volume and survive
# image upgrades.
#
# Building locally instead of pulling:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
name: kirameku

services:
  app:
    image: ${KIRAMEKU_IMAGE:-ghcr.io/yawanaika/kirameku-lite:latest}
    # `docker compose up -d` should always pick up a freshly pushed :latest.
    pull_policy: always
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    expose:
      - "3000"
    networks:
      edge:
        # Stable DNS name for proxies on the shared network. The compose service
        # name ("app") is too generic and can collide with other projects that
        # join the same network.
        aliases:
          - kirameku-app
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_PATH: /data/db/kirameku.db
      UPLOAD_DIR: /data/uploads
      BACKUP_DIR: /data/backups
      # Required: generate with `openssl rand -base64 48` (>= 32 chars).
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required; copy compose.env.example to .env and fill it in}
      CRON_SECRET: ${CRON_SECRET:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      SITE_READ_ONLY: ${SITE_READ_ONLY:-0}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_CUSTOM_DOMAIN: ${OSS_CUSTOM_DOMAIN:-}
      OSS_PREFIX: ${OSS_PREFIX:-}
      VISITOR_RETENTION_DAYS: ${VISITOR_RETENTION_DAYS:-90}
    volumes:
      - kirameku-data:/data

volumes:
  kirameku-data:

networks:
  edge:
    # Created once with `docker network create kirameku-edge`. Owned by no
    # project so `docker compose down` never pulls it out from under the proxy.
    external: true
    name: ${SHARED_NETWORK:-kirameku-edge}
