name: Verify

# Reusable quality gate. Called by ci.yml (pull requests) and release.yml
# (push to main / tags) so image publishing can never skip typecheck or tests.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, test, migrate, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Kirameku

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Kirameku/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Migrate an empty SQLite database
        run: pnpm db:migrate
        env:
          DATABASE_PATH: ./data/ci.db

      - name: Production build
        run: pnpm build
        env:
          DATABASE_PATH: ./data/ci.db
          AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef

  compose:
    name: Compose config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Every supported combination must render. The base file is the default
      # (app on the shared kirameku-edge network, no published port); the two
      # overlays switch to a bundled Caddy or a host-level proxy.
      - name: Validate Compose config
        env:
          AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
          SITE_DOMAIN: example.test
        run: |
          set -euo pipefail
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.caddy.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.host-proxy.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml config -q
