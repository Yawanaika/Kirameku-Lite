name: CI

on:
  pull_request:
  workflow_dispatch:

# Pushes to main are covered by release.yml, which runs the same reusable verify
# workflow before publishing an image. Keeping this file PR-only avoids running
# the full suite twice for every merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
