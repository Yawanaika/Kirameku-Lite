name: Ops SSH (temporary)

# TEMPORARY: used once to run an f2b unban from a GitHub runner because the
# operator's IP was banned. Delete this file afterwards.
on:
  workflow_dispatch:
    inputs:
      command:
        description: Command to run on the server
        required: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Run
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          CMD: ${{ inputs.command }}
        run: |
          set -eu
          ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$USER@$HOST" "$CMD"
