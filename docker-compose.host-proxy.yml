# Override for a proxy that runs directly on the host (systemd Caddy, Nginx,
# or a host-networked container).
#
# Publishing the port is what a *host* proxy needs: it connects to
# 127.0.0.1:3000. A proxy running as a container in another compose project
# cannot do that — it must join the `kirameku-edge` network and use
# `reverse_proxy kirameku-app:3000` instead (the default setup, no override).
#
#   docker compose -f docker-compose.yml -f docker-compose.host-proxy.yml up -d app
#
# Host Caddy equivalent of the bundled Caddyfile:
#
#   boke.example.com {
#       encode zstd gzip
#       request_body { max_size 12MB }
#       reverse_proxy 127.0.0.1:3000
#   }
services:
  app:
    ports:
      - "127.0.0.1:3000:3000"
